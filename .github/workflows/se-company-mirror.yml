name: Mirror the Swedish company register

# /se/company reads Bolagsverket's and SCB's free weekly bulk files (EU high-value datasets, "värdefulla datamängder":
# no agreement, commercial reuse allowed). The two zips are 250 MB and 70 MB, too large for a Worker, so this job
# downloads them on GitHub's servers, keeps legal persons only (no sole traders, no c/o lines) and publishes 509
# company shards plus a name index as release assets. Bolagsverket refreshes the files on Mondays; this runs on
# Tuesdays, on demand, and when the builder or this workflow changes.
on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
  push:
    branches: [main, claude/se-company]
    paths:
      - scripts/build-se-company-index.mjs
      - .github/workflows/se-company-mirror.yml

concurrency:
  group: se-company-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write # Create and update the se-register release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the two bulk files
        run: |
          set -euo pipefail
          base=https://vardefulla-datamangder.bolagsverket.se
          curl -fsSI "$base/bolagsverket/bolagsverket_bulkfil.zip" | tr -d '\r' | grep -i '^last-modified:' | cut -d' ' -f2- > bv-date.txt || true
          # The server closes long transfers part way (75 of 240 MB on 11 Nov 2026): resume until the size matches.
          for f in bolagsverket/bolagsverket_bulkfil.zip scb/scb_bulkfil.zip; do
            out=$(basename "$f")
            want=$(curl -fsSI "$base/$f" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            rm -f "$out"
            for try in $(seq 1 40); do
              curl -sS -L -C - --speed-limit 1000 --speed-time 60 -o "$out" "$base/$f" || true
              have=$(stat -c %s "$out" 2>/dev/null || echo 0)
              echo "$out: $have of $want bytes after try $try"
              [ "$have" = "$want" ] && break
              sleep 5
            done
            test "$(stat -c %s "$out")" = "$want"
          done
          ls -l *.zip
          unzip -o -q bolagsverket_bulkfil.zip -d bv
          unzip -o -q scb_bulkfil.zip -d scb
          ls -l bv scb

      - name: Build the shards
        run: |
          set -euo pipefail
          export SE_DATA_AS_OF=$(date -u -d "$(cat bv-date.txt)" +%F 2>/dev/null || date -u +%F)
          export SE_FILE_TAG="$SE_DATA_AS_OF-${{ github.run_id }}"
          node repo/scripts/build-se-company-index.mjs bv/*.txt out scb/*.txt
          ls -l out

      - name: Publish
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh release view se-register --repo "$repo" >/dev/null 2>&1 || gh release create se-register --repo "$repo" --prerelease \
            --title "Swedish company register" \
            --notes "Legal persons from Bolagsverket's and SCB's weekly open bulk files (värdefulla datamängder, free for reuse), packed for /se/company: two files of gzip shards and manifest.json with each shard's byte range. Sole traders and c/o lines are left out. Register facts only, not credit information. Source: https://bolagsverket.se/apierochoppnadata/hamtaforetagsinformation/nedladdningsbarafiler.2517.html"
          # New file names first, the manifest that points at them last.
          gh release upload se-register out/se-*.bin --repo "$repo"
          gh release upload se-register out/manifest.json --repo "$repo" --clobber
          # Keep this build and the one before (an isolate may still hold the previous manifest for an hour).
          gh api "repos/$repo/releases/tags/se-register" --jq '.assets[] | select(.name | endswith(".bin")) | [.created_at, .id, .name] | @tsv' \
            | sort -r | awk -F'\t' '{ split($3, p, "-"); kind = p[2]; seen[kind]++; if (seen[kind] > 2) print $2 }' \
            | while read -r id; do gh api -X DELETE "repos/$repo/releases/assets/$id"; done
          gh api "repos/$repo/releases/tags/se-register" --jq '.assets[].name'
          node -e 'const m=require("./out/manifest.json"); delete m.files; console.log(JSON.stringify(m))'