name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry. Runs on GitHub's servers
# and signs in with the repository's own identity (OIDC), so no secrets are needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build section manifests
        run: |
          npm ci
          node scripts/build-registry-manifests.mjs

      # The main server, then one entry per MCP section server (/mcp/<section>). A version that is
      # already published is reported and skipped, so re-running the workflow is safe.
      - name: Publish servers to MCP Registry
        run: |
          failed=0
          for manifest in server.json registry/*.json; do
            if ./mcp-publisher publish "$manifest"; then echo "published $manifest"
            else echo "::warning::publish failed for $manifest"; failed=$((failed + 1)); fi
          done
          echo "$failed manifest(s) not published"
