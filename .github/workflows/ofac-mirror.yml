name: Mirror OFAC SDN list

# OFAC's download hosts fail the TLS handshake with Cloudflare Workers (HTTP 525), so
# /sanctions/check reads a copy published here as release assets. Runs on GitHub's
# servers every 6 hours, on demand, and whenever the index builder or this workflow
# changes on main (so a change is published without waiting for the schedule).
# The files are OFAC's own, unmodified.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-ofac-index.mjs
      - scripts/build-intl-sanctions-index.mjs
      - src/lib/intl-sanctions.ts
      - .github/workflows/ofac-mirror.yml

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create and update the ofac-latest release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download SDN.CSV and ALT.CSV from OFAC
        run: |
          set -euo pipefail
          for f in SDN ALT; do
            lower=$(echo "$f" | tr '[:upper:]' '[:lower:]')
            curl -fsSL --retry 3 -o "$f.CSV" "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/$f.CSV" \
              || curl -fsSL --retry 3 -o "$f.CSV" "https://www.treasury.gov/ofac/downloads/$lower.csv"
          done
          # Refuse to publish a truncated or HTML answer.
          sdn=$(wc -l < SDN.CSV); alt=$(wc -l < ALT.CSV)
          echo "SDN.CSV $sdn lines, ALT.CSV $alt lines"
          test "$sdn" -gt 1000 && test "$alt" -gt 1000
          grep -q "Digital Currency Address" SDN.CSV

      - uses: actions/checkout@v5
        with:
          path: repo

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the pre-parsed index the Worker loads
        run: |
          set -euo pipefail
          cd repo && npm ci --no-audit --no-fund
          node scripts/build-ofac-index.mjs ../SDN.CSV ../ALT.CSV ../ofac-index.json

      - name: Publish as the ofac-latest release
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh release view ofac-latest --repo "$repo" >/dev/null 2>&1 || gh release create ofac-latest --repo "$repo" \
            --title "OFAC SDN list mirror" --prerelease \
            --notes "Unmodified copies of OFAC's SDN.CSV and ALT.CSV plus ofac-index.json (the same data pre-parsed), refreshed every 6 hours for /sanctions/check. Source: https://ofac.treasury.gov/"
          gh release upload ofac-latest SDN.CSV ALT.CSV ofac-index.json --repo "$repo" --clobber

      # EU, UN and UK lists for name screening (src/lib/intl-sanctions.ts). All three must download and
      # pass their size checks, or the step fails and the previous intl-sanctions-index.json stays published.
      # Licences: EU Commission reuse policy (Decision 2011/833/EU), UN public, UK Open Government Licence v3.0.
      - name: Build and publish the EU, UN and UK index
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o eu.xml "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw"
          curl -fsSL --retry 3 -o un.xml "https://scsanctions.un.org/resources/xml/en/consolidated.xml"
          curl -fsSL --retry 3 -o uk.xml "https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.xml"
          ls -l eu.xml un.xml uk.xml
          (cd repo && node scripts/build-intl-sanctions-index.mjs ../eu.xml ../un.xml ../uk.xml ../intl-sanctions-index.json)
          gh release upload ofac-latest intl-sanctions-index.json --repo "${{ github.repository }}" --clobber
