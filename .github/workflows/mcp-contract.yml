name: MCP contract

on:
  push:
  pull_request:
  # release.ps1 starts it by hand when GitHub did not start a push run for a merge commit (22 Oct 2026, 1.50.3);
  # the deploy guard needs a successful run for the exact commit.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:output-validators
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:mcp-contract
      - run: npm run check:ownership
      - run: npm run check:ownership
