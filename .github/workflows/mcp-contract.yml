name: MCP contract

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:output-validators
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:mcp-contract
